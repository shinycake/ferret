name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ ${#candidates[@]} -gt 0 ]; then
            if command -v gsort >/dev/null 2>&1 && gsort -V </dev/null >/dev/null 2>&1; then
              X=$(printf '%s\n' "${candidates[@]}" | gsort -V | tail -1)
            elif sort -V </dev/null >/dev/null 2>&1; then
              X=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
            else
              X=$(printf '%s\n' "${candidates[@]}" | sort | tail -1)
            fi
            echo "Selecting $X"
            sudo xcode-select -s "$X"
          else
            echo "No Xcode 26 install found; using the default toolchain"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen
          xcodegen --version

      - name: Read fsearch pin
        id: pin
        run: |
          set -euo pipefail
          echo "sha=$(sed -n '2p' third_party/fsearch.pin)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Checkout pinned fsearch
        run: |
          set -euo pipefail
          URL=$(sed -n '1p' third_party/fsearch.pin)
          SHA=$(sed -n '2p' third_party/fsearch.pin)
          SRC=build/fsearch-src
          mkdir -p build
          if [ ! -d "$SRC/.git" ]; then
            git clone --filter=blob:none "$URL" "$SRC"
          fi
          git -C "$SRC" fetch --depth 1 origin "$SHA"
          git -C "$SRC" checkout --detach "$SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SHA"
          git -C "$SRC" rev-parse --short HEAD

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/fsearch-src
          key: fsearch-${{ steps.pin.outputs.sha }}
          cache-on-failure: true

      - name: Build fsearch
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir -p proof
          chmod +x scripts/build-fsearch.sh scripts/bundle-fsearch.sh
          start=$(date +%s)
          scripts/build-fsearch.sh 2>&1 | tee proof/fsearch-build.log
          end=$(date +%s)
          echo $((end - start)) | tee proof/fsearch-build-seconds.txt

      - name: Tampered pin fails the build script
        run: |
          set -euo pipefail
          mkdir -p proof
          cp third_party/fsearch.pin "$RUNNER_TEMP/fsearch.pin.bak"
          printf '%s\n%s\n' 'https://github.com/noahdunnagan/fsearch.git' '0000000000000000000000000000000000000000' > third_party/fsearch.pin
          set +e
          scripts/build-fsearch.sh >proof/tampered-sha.log 2>&1
          code=$?
          set -e
          mv "$RUNNER_TEMP/fsearch.pin.bak" third_party/fsearch.pin
          if [ "$code" -eq 0 ]; then
            echo "tampered SHA was accepted" >&2
            exit 1
          fi
          SHA=$(sed -n '2p' third_party/fsearch.pin)
          test "$(git -C build/fsearch-src rev-parse HEAD)" = "$SHA"
          echo "tampered SHA failed with exit ${code}"
          tail -30 proof/tampered-sha.log

      - name: Test FerretCore
        run: |
          set -euo pipefail
          mkdir -p proof
          swift test --package-path Packages/FerretCore --parallel --xunit-output "$PWD/proof/core-tests.xml" 2>&1 | tee proof/core-tests.log

      - name: Test FSearchClient
        run: |
          set -euo pipefail
          mkdir -p proof
          swift test --package-path Packages/FerretCore --filter ClientTests 2>&1 | tee proof/client-tests.log

      - name: Generate and build
        run: |
          set -euo pipefail
          mkdir -p proof
          xcodegen generate
          xcodebuild -project Ferret.xcodeproj -scheme Ferret -configuration Release -destination 'platform=macOS' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee proof/xcodebuild.log

      - name: Missing fsearch binary fails the Xcode build
        run: |
          set -euo pipefail
          mkdir -p proof
          mv build/fsearch/fsearch build/fsearch/fsearch.aside
          set +e
          xcodebuild -project Ferret.xcodeproj -scheme Ferret -configuration Release -destination 'platform=macOS' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build >proof/missing-binary.log 2>&1
          code=$?
          set -e
          mv build/fsearch/fsearch.aside build/fsearch/fsearch
          if [ "$code" -eq 0 ]; then
            echo "xcodebuild succeeded without the fsearch binary" >&2
            exit 1
          fi
          grep -q "run scripts/build-fsearch.sh first" proof/missing-binary.log
          xcodebuild -project Ferret.xcodeproj -scheme Ferret -configuration Release -destination 'platform=macOS' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build >proof/xcodebuild-restore.log 2>&1

      - name: Check bundled fsearch
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Ferret.app"
          BIN="$APP/Contents/MacOS/fsearch"
          test -x "$BIN"
          test -f "$APP/Contents/Resources/ThirdPartyLicenses/fsearch-LICENSE.txt"
          grep -q "Permission is hereby granted" "$APP/Contents/Resources/ThirdPartyLicenses/fsearch-LICENSE.txt"
          pin=$(sed -n '2p' third_party/fsearch.pin)
          grep -qx "$pin" "$APP/Contents/Resources/FSearchPin.txt"
          mkdir -p proof
          lipo -info "$BIN" | tee proof/lipo.txt
          grep -q x86_64 proof/lipo.txt
          grep -q arm64 proof/lipo.txt
          codesign --force --sign - "$BIN"
          set +e
          "$BIN" >proof/fsearch-usage.out 2>proof/fsearch-usage.err
          code=$?
          set -e
          echo "fsearch exit ${code}" | tee proof/fsearch-usage-status.txt
          test "$code" -eq 0
          test ! -s proof/fsearch-usage.out
          diff -u scripts/expected-fsearch-usage.txt proof/fsearch-usage.err

      - name: Smoke demo-exit
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Ferret.app"
          mkdir -p proof
          codesign --force --sign - -o runtime \
            --entitlements FinderSync/FerretFinderSync.entitlements \
            "$APP/Contents/PlugIns/FerretFinderSync.appex"
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP" >proof/smoke-codesign.txt 2>&1
          FERRET_DEMO=1 "$APP/Contents/MacOS/Ferret" --demo-exit >proof/smoke.log 2>&1 &
          pid=$!
          status=0
          exited=0
          for _ in $(seq 1 45); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              exited=1
              break
            fi
            sleep 1
          done
          if [ "$exited" -ne 1 ]; then
            echo "smoke test timed out after 45s" | tee -a proof/smoke.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "exit $status" | tee -a proof/smoke.log
          cat proof/smoke.log
          test "$status" -eq 0

      - name: Record Finder Sync appex
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Ferret.app"
          APPEX="$APP/Contents/PlugIns/FerretFinderSync.appex"
          mkdir -p proof
          if ! codesign -d --entitlements :- "$APPEX" >proof/appex-entitlements.txt 2>&1; then
            codesign -d --entitlements - "$APPEX" >proof/appex-entitlements.txt 2>&1
          fi
          grep -q "com.apple.security.app-sandbox" proof/appex-entitlements.txt
          plutil -p "$APPEX/Contents/Info.plist" | tee proof/appex-plutil.txt
          point="$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$APPEX/Contents/Info.plist")"
          test "$point" = "com.apple.FinderSync"
          {
            echo "=== pluginkit -a ==="
            pluginkit -a "$APPEX" || echo "pluginkit -a failed (best effort, exit $?)"
            echo "=== pluginkit -m -v -i com.shinycake.ferret.FinderSync ==="
            pluginkit -m -v -i com.shinycake.ferret.FinderSync || echo "pluginkit -m failed (best effort, exit $?)"
          } >proof/pluginkit.txt 2>&1 || true
          echo "pluginkit recorded (best effort; does not fail the build)"

      - name: Onboarding snapshot
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Ferret.app"
          mkdir -p proof/snapshots
          FERRET_DEMO=1 "$APP/Contents/MacOS/Ferret" --demo-snapshot \
            --screen onboarding \
            --out "$PWD/proof/snapshots/10-onboarding.png" >proof/onboarding-snapshot.log 2>&1 &
          pid=$!
          status=0
          exited=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              exited=1
              break
            fi
            sleep 1
          done
          if [ "$exited" -ne 1 ]; then
            echo "onboarding snapshot timed out" | tee -a proof/onboarding-snapshot.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "exit $status" | tee -a proof/onboarding-snapshot.log
          cat proof/onboarding-snapshot.log
          test "$status" -eq 0
          test -s proof/snapshots/10-onboarding.png
          python3 -c 'import pathlib; p=pathlib.Path("proof/snapshots/10-onboarding.png"); assert p.read_bytes()[:8]==b"\x89PNG\r\n\x1a\n"'
          sips -g pixelWidth -g pixelHeight proof/snapshots/10-onboarding.png | tee proof/onboarding-snapshot-size.txt
          w=$(awk '/pixelWidth/ {print $2}' proof/onboarding-snapshot-size.txt)
          h=$(awk '/pixelHeight/ {print $2}' proof/onboarding-snapshot-size.txt)
          test "$w" -gt 200
          test "$h" -gt 200

      - name: Settings snapshot
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Ferret.app"
          mkdir -p proof/snapshots
          FERRET_DEMO=1 "$APP/Contents/MacOS/Ferret" --demo-snapshot \
            --screen settings \
            --out "$PWD/proof/snapshots/11-settings.png" >proof/settings-snapshot.log 2>&1 &
          pid=$!
          status=0
          exited=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              exited=1
              break
            fi
            sleep 1
          done
          if [ "$exited" -ne 1 ]; then
            echo "settings snapshot timed out" | tee -a proof/settings-snapshot.log
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "exit $status" | tee -a proof/settings-snapshot.log
          cat proof/settings-snapshot.log
          test "$status" -eq 0
          test -s proof/snapshots/11-settings.png
          python3 -c 'import pathlib; p=pathlib.Path("proof/snapshots/11-settings.png"); assert p.read_bytes()[:8]==b"\x89PNG\r\n\x1a\n"'
          sips -g pixelWidth -g pixelHeight proof/snapshots/11-settings.png | tee proof/settings-snapshot-size.txt
          w=$(awk '/pixelWidth/ {print $2}' proof/settings-snapshot-size.txt)
          h=$(awk '/pixelHeight/ {print $2}' proof/settings-snapshot-size.txt)
          test "$w" -gt 200
          test "$h" -gt 200

      - name: Check bundle acceptance
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release/Ferret.app"
          test -d "$APP/Contents/PlugIns/FerretFinderSync.appex"
          lsui="$(plutil -extract LSUIElement raw -o - "$APP/Contents/Info.plist")"
          test "$lsui" = "true"
          scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$APP/Contents/Info.plist")"
          test "$scheme" = "ferret"
          mkdir -p proof
          {
            echo "=== plutil -p ==="
            plutil -p "$APP/Contents/Info.plist"
            echo "=== find Ferret.app -maxdepth 4 ==="
            find "$APP" -maxdepth 4 | sort
          } | tee proof/bundle-acceptance.txt

      - name: Test Ferret app
        run: |
          set -euo pipefail
          mkdir -p proof
          xcodebuild build-for-testing \
            -project Ferret.xcodeproj \
            -scheme Ferret \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            2>&1 | tee proof/apptests-build.log
          APP="build/dd/Build/Products/Debug/Ferret.app"
          codesign --force --sign - "$APP/Contents/MacOS/fsearch"
          codesign --force --sign - "$APP/Contents/PlugIns/FerretFinderSync.appex"
          codesign --force --sign - "$APP"
          if [ -d build/dd/Build/Products/Debug/AppTests.xctest ]; then
            codesign --force --sign - build/dd/Build/Products/Debug/AppTests.xctest
          fi
          xctestrun=""
          while IFS= read -r -d '' candidate; do
            xctestrun=$candidate
            break
          done < <(find build/dd/Build/Products -name '*.xctestrun' -maxdepth 2 -print0)
          test -n "$xctestrun"
          echo "xctestrun $xctestrun" | tee proof/apptests.log
          set +e
          set +o pipefail
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination 'platform=macOS' \
            -resultBundlePath "$PWD/proof/AppTests.xcresult" \
            -parallel-testing-enabled NO \
            2>&1 | tee -a proof/apptests.log
          code=${PIPESTATUS[0]}
          set -o pipefail
          set -e
          if ! xcrun xcresulttool get test-results summary --path proof/AppTests.xcresult > proof/apptests-summary.json 2>proof/xcresulttool.err; then
            xcrun xcresulttool get --legacy --format json --path proof/AppTests.xcresult > proof/apptests-summary.json 2>>proof/xcresulttool.err || true
          fi
          echo "app tests exit ${code}" | tee -a proof/apptests.log
          exit "$code"

      - name: Package
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          scripts/package.sh
          unzip -l dist/Ferret-*.zip | tee proof/package-list.txt
          unzip -l dist/Ferret-*.zip | grep -q "Ferret.app/Contents/PlugIns/FerretFinderSync.appex"
          unzip -l dist/Ferret-*.zip | grep -q "Ferret.app/Contents/MacOS/fsearch"
          unzip -l dist/Ferret-*.zip | grep -q "Ferret.app/Contents/Resources/ThirdPartyLicenses/fsearch-LICENSE.txt"
          unzip -l dist/Ferret-*.zip | grep -q "Ferret.app/Contents/Resources/FSearchPin.txt"

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ferret-app
          path: dist/
          if-no-files-found: warn

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: proof/
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          set +e
          APP="build/dd/Build/Products/Release/Ferret.app"
          {
            echo "## Ferret CI"
            echo ""
            echo "### Test counts"
            echo '```'
            if [ -f proof/core-tests.log ]; then
              grep -E "Testing FerretCore|Test run|passed|failed|error:" proof/core-tests.log | tail -30
            else
              echo "core-tests.log missing"
            fi
            if [ -f proof/core-tests.xml ]; then
              grep '<testsuite ' proof/core-tests.xml
            fi
            echo "--- ScopeResolver / URLRoute / Onboarding ---"
            if [ -f proof/core-tests.log ]; then
              grep -E "ScopeResolverTests|URLRouteTests|OnboardingModelTests|ResultFilterTests|SettingsTests" proof/core-tests.log || true
            fi
            echo '```'
            echo ""
            echo "### fsearch build"
            echo '```'
            if [ -f proof/fsearch-build-seconds.txt ]; then
              echo "seconds: $(cat proof/fsearch-build-seconds.txt)"
            fi
            if [ -f proof/fsearch-build.log ]; then
              echo "Compiling lines: $(grep -c 'Compiling ' proof/fsearch-build.log || true)"
              echo "A later run with zero Compiling lines is a Rust cache hit."
            else
              echo "fsearch-build.log missing"
            fi
            echo '```'
            echo ""
            echo "### lipo -info"
            echo '```'
            if [ -f proof/lipo.txt ]; then
              cat proof/lipo.txt
            else
              echo "lipo.txt missing"
            fi
            echo '```'
            echo ""
            echo "### fsearch usage (stderr)"
            echo '```'
            if [ -f proof/fsearch-usage.err ]; then
              cat proof/fsearch-usage.err
              echo "---"
              cat proof/fsearch-usage-status.txt
            else
              echo "usage missing"
            fi
            echo '```'
            echo ""
            echo "### codesign"
            echo '```'
            if [ -f proof/smoke-codesign.txt ]; then
              cat proof/smoke-codesign.txt
            else
              echo "n/a"
            fi
            echo '```'
            echo ""
            echo "### Finder Sync appex entitlements"
            echo '```'
            if [ -f proof/appex-entitlements.txt ]; then
              cat proof/appex-entitlements.txt
            else
              echo "appex-entitlements.txt missing"
            fi
            echo '```'
            echo ""
            echo "### Finder Sync plutil"
            echo '```'
            if [ -f proof/appex-plutil.txt ]; then
              cat proof/appex-plutil.txt
            else
              echo "appex-plutil.txt missing"
            fi
            echo '```'
            echo ""
            echo "### pluginkit (best effort)"
            echo '```'
            if [ -f proof/pluginkit.txt ]; then
              cat proof/pluginkit.txt
            else
              echo "pluginkit.txt missing"
            fi
            echo '```'
            echo ""
            echo "### App tests"
            echo '```'
            if [ -f proof/apptests.log ]; then
              grep -E "MENU_TITLES:|LIVE_MENU_TITLES:|DOCK:|DaemonManager.start|results cleanup|TEST SUCCEEDED|TEST FAILED|failed" proof/apptests.log | tail -80
            else
              echo "apptests.log missing"
            fi
            echo '```'
            echo ""
            echo "### snapshots"
            echo '```'
            if ls proof/snapshots/*.png >/dev/null 2>&1; then
              ls -la proof/snapshots
              if [ -f proof/onboarding-snapshot-size.txt ]; then
                cat proof/onboarding-snapshot-size.txt
              fi
              if [ -f proof/onboarding-snapshot.log ]; then
                cat proof/onboarding-snapshot.log
              fi
              if [ -f proof/settings-snapshot-size.txt ]; then
                cat proof/settings-snapshot-size.txt
              fi
              if [ -f proof/settings-snapshot.log ]; then
                cat proof/settings-snapshot.log
              fi
            else
              echo "n/a"
            fi
            echo '```'
            echo ""
            echo "### perf"
            echo '```'
            echo "n/a"
            echo '```'
            echo ""
            echo "### plutil -p"
            echo '```'
            if [ -d "$APP" ]; then
              plutil -p "$APP/Contents/Info.plist"
            else
              echo "app missing"
            fi
            echo '```'
            echo ""
            echo "### find Ferret.app -maxdepth 4"
            echo '```'
            if [ -d "$APP" ]; then
              find "$APP" -maxdepth 4 | sort
            else
              echo "app missing"
            fi
            echo '```'
            echo ""
            echo "### smoke"
            echo '```'
            if [ -f proof/smoke.log ]; then
              cat proof/smoke.log
            else
              echo "smoke.log missing"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
